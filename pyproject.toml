[project]
name = "alice"
version = "0.1.0b1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.*",
  "uvicorn==0.32.*",
  "pydantic==2.*",
  "pydantic-settings==2.*",
  "httpx==0.28.*",
  "prometheus-client==0.21.*",
  "pypdf==5.*",
  "openpyxl==3.1.*",
  "pyyaml==6.*",
  "python-multipart==0.0.*",
  "tzdata==2025.*",
  "pywebpush==2.3.*",
  "faster-whisper>=1.2.1",
]

[dependency-groups]
dev = ["pytest==8.*", "pytest-asyncio==0.24.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: needs live local services (ollama, qdrant, prometheus)"]

[tool.uv]
package = false
